<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>삼도류 검사</title>
<style>
:root{--bg:#0d0f1a}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000;image-rendering:pixelated}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);color:#fff;font:bold 20px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;width:64px;height:64px;touch-action:none}
.tb.on{background:rgba(255,215,90,.4)}
#joy{position:absolute;left:0;bottom:0;width:45%;height:65%;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;left:calc(36px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);box-sizing:border-box;transition:opacity .15s;opacity:.7}
#joyBase.on{opacity:1;transition:none}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7);box-sizing:border-box}
#joyBase.on #joyKnob{background:rgba(255,215,90,.55)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div class="tb" data-k="attack" style="right:96px;bottom:24px">⚔</div>
  <div class="tb" data-k="jump"  style="right:16px;bottom:64px">⤒</div>
  <div class="tb" data-k="dash"  style="right:176px;bottom:24px;width:56px;height:56px">»</div>
  <div class="tb sk" data-k="sk1" style="right:96px;bottom:104px;width:56px;height:56px;font-size:14px">삼검</div>
  <div class="tb sk" data-k="sk2" style="right:176px;bottom:96px;width:56px;height:56px;font-size:14px">흑풍</div>
  <div class="tb sk" data-k="ult" style="right:24px;bottom:150px;width:60px;height:60px;font-size:14px;border-color:#c07aff">흑월</div>
  <div class="tb" data-k="pause" style="right:16px;top:16px;width:44px;height:44px;font-size:16px">II</div>
</div>
<script>
'use strict';
// ================= 기본 설정 =================
const cv=document.getElementById('c'),mainCtx=cv.getContext('2d');let ctx=mainCtx;
// 픽셀 렌더링: 절반 해상도 레이어에 그린 뒤 확대 (1칸 = 16×16 픽셀)
const PX=2,ZOOM=1.5,VW=640,VH=360,SC=3,LW=320,LH=180; // 월드 1.5배 확대: 논리 2px = 저해상도 1px = 화면 3px
function layer(){const c=document.createElement('canvas');c.width=LW;c.height=LH;const x=c.getContext('2d',{willReadFrequently:true});return{c,x};}
const BG=layer(),FG=layer(),FX=layer(),UI=layer();
const OUTLINE=0xff1c1018,PXMASK=new Uint8Array(LW*LH);
let textQ=[];
const W=960,H=540,T=32,GRAV=1800,JUMP=580,STEP=1/60;
// 선명한 화면: 캔버스 실제 픽셀을 보이는 크기 × 기기 배율로 맞추고, 그림은 그 위에 확대해서 그려요.
let RS=1;
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H),cw=Math.max(1,Math.floor(W*s)),ch=Math.max(1,Math.floor(H*s));
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  const dpr=Math.min(3,window.devicePixelRatio||1),bw=Math.min(3840,Math.round(cw*dpr));
  RS=bw/W;cv.width=bw;cv.height=Math.round(H*RS);
  mainCtx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t,ease=t=>1-(1-t)*(1-t)*(1-t);
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const hash=(n)=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ================= 입력 =================
const keys={},pressed={},released={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',ArrowDown:'down',KeyS:'down',
  KeyJ:'attack',KeyZ:'attack',KeyK:'dash',KeyX:'dash',ShiftLeft:'dash',ShiftRight:'dash',KeyL:'sk1',KeyC:'sk1',KeyU:'sk2',KeyV:'sk2',KeyI:'ult',KeyB:'ult',
  Escape:'pause',KeyP:'pause',Enter:'start',KeyM:'mute'};
function press(a){if(!keys[a])pressed[a]=true;keys[a]=true;}
function release(a){if(keys[a])released[a]=true;keys[a]=false;}
addEventListener('keydown',e=>{const a=KEYMAP[e.code];initAudio();if(a){e.preventDefault();if(!e.repeat)press(a);}});
addEventListener('keyup',e=>{const a=KEYMAP[e.code];if(a){e.preventDefault();release(a);}});
addEventListener('blur',()=>{for(const k in keys)release(k);});
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
if(isTouch)document.getElementById('touch').style.display='block';
document.querySelectorAll('.tb').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();initAudio();b.classList.add('on');press(k);};
  const up=e=>{e.preventDefault();b.classList.remove('on');release(k);};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});
// ----- 가상 조이스틱 (왼쪽 화면 아무 곳이나 누르면 그 자리에 생김) -----
let analogX=null;
const SRC={joy:{},pad:{}};
function srcSet(src,k,on){if(!!SRC[src][k]===on)return;SRC[src][k]=on;on?press(k):release(k);}
(function(){
  const zone=document.getElementById('joy'),base=document.getElementById('joyBase'),knob=document.getElementById('joyKnob'),R=48;
  let id=null,cx=0,cy=0;
  function setStick(dx,dy){
    const d=Math.hypot(dx,dy),m=Math.min(d,R),kx=d?dx/d*m:0,ky=d?dy/d*m:0;
    knob.style.transform='translate('+kx+'px,'+ky+'px)';
    const nx=kx/R,ny=ky/R;
    srcSet('joy','left',nx<-0.3);srcSet('joy','right',nx>0.3);srcSet('joy','down',ny>0.6&&Math.abs(nx)<0.75);
    analogX=Math.abs(nx)>0.3?nx:0;
  }
  function end(e){if(e.pointerId!==id)return;id=null;analogX=null;base.classList.remove('on');base.style.left=base.style.top='';base.style.bottom='';knob.style.transform='';
    srcSet('joy','left',false);srcSet('joy','right',false);srcSet('joy','down',false);}
  zone.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(id!==null)return;id=e.pointerId;try{zone.setPointerCapture(id);}catch(_){}
    const r=zone.getBoundingClientRect();
    const bl=clamp(e.clientX-r.left-60,8,Math.max(8,r.width-128)),bt=clamp(e.clientY-r.top-60,8,Math.max(8,r.height-128));
    cx=r.left+bl+60;cy=r.top+bt+60;
    base.style.left=bl+'px';base.style.top=bt+'px';base.style.bottom='auto';base.classList.add('on');setStick(0,0);});
  zone.addEventListener('pointermove',e=>{if(e.pointerId===id){e.preventDefault();setStick(e.clientX-cx,e.clientY-cy);}});
  zone.addEventListener('pointerup',end);zone.addEventListener('pointercancel',end);
})();
// ----- 실제 게임패드 -----
function pollPad(){
  let gp=null;try{const l=navigator.getGamepads?navigator.getGamepads():[];for(const g of l)if(g&&g.connected){gp=g;break;}}catch(e){}
  if(!gp){for(const k in SRC.pad)if(SRC.pad[k])srcSet('pad',k,false);if(SRC.pad.analog){SRC.pad.analog=false;analogX=null;}return;}
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),x=gp.axes[0]||0,y=gp.axes[1]||0;
  srcSet('pad','left',x<-0.3||b(14));srcSet('pad','right',x>0.3||b(15));srcSet('pad','down',y>0.6||b(13));
  srcSet('pad','jump',b(0));srcSet('pad','attack',b(2));srcSet('pad','dash',b(1)||b(5));srcSet('pad','sk1',b(3));srcSet('pad','sk2',b(4));srcSet('pad','ult',b(6)||b(7));
  srcSet('pad','start',b(9));srcSet('pad','pause',b(9)&&state==='play');
  if(Math.abs(x)>0.3){analogX=x;SRC.pad.analog=true;}else if(SRC.pad.analog){analogX=null;SRC.pad.analog=false;}
}

// ================= 소리 =================
let AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='square',v=0.06,slide=0,delay=0){
  if(!AC||muted)return;const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);}
function noise(d,v=0.08,f=1200){
  if(!AC||muted)return;const n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;
  s.buffer=buf;g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start();}
const SFX={
  jump:()=>tone(380,0.12,'square',0.04,320),dj:()=>tone(520,0.14,'triangle',0.06,500),
  swing:()=>noise(0.08,0.06,3000),hit:()=>{noise(0.1,0.12,1800);tone(160,0.1,'square',0.05,-80);},
  coin:()=>{tone(988,0.07,'square',0.035);tone(1319,0.12,'square',0.035,0,0.06);},
  hurt:()=>{tone(220,0.25,'sawtooth',0.08,-150);noise(0.15,0.08,900);},
  dash:()=>noise(0.15,0.07,600),throw:()=>tone(700,0.15,'triangle',0.05,600),nope:()=>tone(140,0.12,'square',0.04),
  kill:()=>{tone(300,0.15,'square',0.05,-200);noise(0.2,0.08,1400);},chest:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,0.12,'square',0.04,0,i*0.07));},
  flag:()=>{[392,523,659].forEach((f,i)=>tone(f,0.18,'triangle',0.06,0,i*0.1));},clink:()=>tone(1500,0.08,'square',0.04,-500),
  arrow:()=>tone(900,0.1,'triangle',0.03,-500),slam:()=>{noise(0.4,0.2,400);tone(80,0.4,'sawtooth',0.1,-40);},
  roar:()=>{tone(110,0.6,'sawtooth',0.08,-50);noise(0.5,0.06,500);},heal:()=>{tone(660,0.2,'sine',0.07,400);},
  buy:()=>{[659,784,988,1319].forEach((f,i)=>tone(f,0.1,'square',0.04,0,i*0.05));},
  clear:()=>{[523,659,784,659,784,1047].forEach((f,i)=>tone(f,0.2,'square',0.05,0,i*0.12));},
  select:()=>tone(600,0.05,'square',0.03),
  swing2:()=>{noise(0.09,0.06,3600);tone(500,0.07,'triangle',0.02,300);},
  swing3:()=>{noise(0.16,0.09,4500);tone(260,0.14,'sawtooth',0.035,500);},
  hop:()=>tone(240,0.12,'square',0.035,260),dive:()=>tone(1100,0.25,'triangle',0.035,-700),
  thrust:()=>{noise(0.12,0.07,2500);tone(180,0.1,'square',0.03,200);},
};
function sfx(n){try{SFX[n]&&SFX[n]();}catch(e){}}

// ================= 스테이지 =================
function mk(w,h){
  const g=[];for(let y=0;y<h;y++)g.push(new Array(w).fill(' '));
  const L={w,h,g,ents:[],start:[3,12]};
  L.r=(x0,y0,x1,y1,c='#')=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(y>=0&&y<h&&x>=0&&x<w)g[y][x]=c;return L;};
  L.gr=(x0,x1,top)=>L.r(x0,top,x1,h-1);
  L.p=(x0,x1,y)=>L.r(x0,y,x1,y,'=');
  L.sp=(x0,x1,y)=>L.r(x0,y,x1,y,'^');
  L.e=(type,x,y)=>{L.ents.push({type,x,y});return L;};
  L.coins=(x0,x1,y)=>{for(let x=x0;x<=x1;x++)L.e('coin',x,y);return L;};
  return L;
}
// ================= 보스 9종 (1-4 바위왕은 위의 updBoss/drawBoss) =================
function eShot(x,y,vx,vy,o){const r=(o&&o.r)||7;projs.push(Object.assign({kind:'orb',owner:'e',x:x-r,y:y-r,w:r*2,h:r*2,vx,vy,dmg:1,life:5,col:'#ff7a3a',col2:'#ffe0a0',r,rot:0},o||{}));}
function aimV(fx,fy,sp,da=0){const a=Math.atan2(P.y+P.h/2-fy,P.x+P.w/2-fx)+da;return[Math.cos(a)*sp,Math.sin(a)*sp];}
function ringShot(x,y,n,sp,off,o){for(let i=0;i<n;i++){const a=off+i/n*Math.PI*2;eShot(x,y,Math.cos(a)*sp,Math.sin(a)*sp,o);}}
function hazard(kind,x,y,w,h,delay,life,o){projs.push(Object.assign({kind,owner:'e',x,y,w,h,vx:0,vy:0,delay,life,dmg:1,pierce:true,noParry:true,max:life},o||{}));}
function quake(b,sp=270){const gy=b.y+b.h;projs.push({kind:'wave',owner:'e',x:b.x-24,y:gy-28,w:24,h:28,vx:-sp,vy:0,dmg:1,life:3});projs.push({kind:'wave',owner:'e',x:b.x+b.w,y:gy-28,w:24,h:28,vx:sp,vy:0,dmg:1,life:3});}
function choose(b,opts){const o=opts.filter(v=>v!==b.last);const r=o[Math.floor(Math.random()*o.length)];b.last=r;return r;}
function pushX(b,d){const nx=b.x+d,y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-0.01)/T),tx=Math.floor((d>0?nx+b.w-0.01:nx)/T);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty))return;b.x=nx;}
function hoverTo(b,dt,k=2.2){b.vx=approach(b.vx,(b.tx-b.x)*k,700*dt);b.vy=approach(b.vy,(b.ty-b.y)*k+Math.sin(gtime*3)*20,700*dt);}
function nextMove(b,st=0.6){b.state='move';b.st=st;b.tx=rand(4*T,25*T-b.w);b.ty=rand(3*T,6.5*T);
  if(b.kind==='witch'){b.st=st+0.7;b.ty=rand(5*T,8*T);}}
function bigBlade(px,py,f,a,len,col='#cfd6e6',hilt='#8a1a2a'){ctx.save();ctx.translate(px,py);ctx.scale(f,1);ctx.rotate(a);ctx.fillStyle='#4a3020';ctx.fillRect(-6,-2,8,4);ctx.fillStyle=hilt;ctx.fillRect(2,-7,4,14);ctx.fillStyle=col;ctx.fillRect(6,-3,len,6);ctx.beginPath();ctx.moveTo(6+len,-3);ctx.lineTo(13+len,0);ctx.lineTo(6+len,3);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillRect(6,-3,len,2);ctx.restore();}
const FIRE={col:'#ff6a1a',col2:'#ffe07a',r:7},VO={col:'#9a5cff',col2:'#ffffff',r:6,life:6};

// ---- 2-4 슬라임 대왕 ----
function updKing(b,dt,dx){
  const ph2=b.hp<=b.maxHp/2;b.st-=dt;b.squash-=dt;b.vy+=GRAV*dt;
  switch(b.state){
    case 'intro':b.vx=0;if(b.st<=0){b.state='idle';b.st=0.5;sfx('roar');shake=8;}break;
    case 'idle':b.vx=approach(b.vx,0,1400*dt);b.face=dx>0?1:-1;
      if(b.st<=0){const o=choose(b,ph2?['hop','slam','spit','hop']:['hop','spit','hop']);
        if(o==='spit'){b.state='spit';b.n=1;b.st=0.7;}else{b.state='crouch';b.next=o;b.st=o==='slam'?1.0:0.75;}}break;
    case 'crouch':b.vx=0;if(b.st<=0){b.state='air';b.airT=0;sfx('hop');
      if(b.next==='slam'){b.vy=-900;b.vx=clamp(dx/1.0,-260,260);}else{b.vy=-560;b.vx=clamp(dx/0.62,-170,170);}}break;
    case 'air':b.airT+=dt;break;
    case 'spit':b.vx=0;if(b.st<=0){const cx=b.x+b.w/2;for(const i of(ph2?[-0.5,0.5]:[0]))eShot(cx,b.y+12,b.face*(120+Math.abs(dx)*0.6)+i*90,-560,{grav:true,col:'#3fbf5a',col2:'#c8ffb8',r:8});
      sfx('hop');b.n--;b.st=0.8;if(b.n<=0){b.state='idle';b.st=ph2?1.0:1.3;}}break;
  }
  moveBody(b,dt,false);
  if(b.state==='air'&&b.onG&&b.airT>0.12){b.squash=0.25;sfx('slam');dust(b.x+b.w/2,b.y+b.h,12);
    if(b.next==='slam'){shake=12;quake(b,180);const n=enemies.filter(e=>e.type==='slime'&&!e.dead).length;
      if(ph2&&n<2)for(const tx of[P.x<b.x?Math.floor((b.x+b.w)/T)+1:Math.floor(b.x/T)-1]){spawn({type:'slime',x:clamp(tx,2,27),y:13});enemies[enemies.length-1].minion=true;}}
    else shake=5;
    b.state='idle';b.st=ph2?1.4:1.8;b.tired=b.st;}
}
function drawKing(b,x,y){
  const f=b.face,sq=b.state==='crouch'?0.25:b.squash>0?0.3:(b.state==='air'&&b.vy<0)?-0.15:0;
  const jx=b.state==='crouch'?Math.sin(gtime*50)*2:0,cx=x+b.w/2+jx,bot=y+b.h,hw=b.w/2*(1+sq*0.5),hh=b.h*(1-sq);
  ctx.fillStyle='#2f9a45';ctx.beginPath();ctx.ellipse(cx,bot-hh*0.5,hw,hh*0.5,0,0,7);ctx.fill();ctx.fillRect(cx-hw,bot-hh*0.3,hw*2,hh*0.3);
  ctx.fillStyle='#5fd35f';ctx.beginPath();ctx.ellipse(cx,bot-hh*0.55,hw-5,hh*0.42,0,0,7);ctx.fill();
  ctx.fillStyle='#b4f5a8';ctx.beginPath();ctx.ellipse(cx-hw*0.45,bot-hh*0.78,9,5,-0.5,0,7);ctx.fill();
  const ey=bot-hh*0.62;ctx.fillStyle='#fff';ctx.fillRect(cx+f*8-16,ey,11,13);ctx.fillRect(cx+f*8+4,ey,11,13);
  ctx.fillStyle='#173a1c';ctx.fillRect(cx+f*8-12+f*2,ey+4,5,7);ctx.fillRect(cx+f*8+8+f*2,ey+4,5,7);
  if(b.hp<=b.maxHp/2){ctx.fillStyle='#173a1c';ctx.fillRect(cx+f*8-17,ey-4,12,3);ctx.fillRect(cx+f*8+4,ey-4,12,3);}
  ctx.fillStyle='#173a1c';ctx.fillRect(cx+f*8-8,ey+18,16,b.state==='spit'?8:3);
  const ty=bot-hh-2;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(cx-18,ty+8);ctx.lineTo(cx-18,ty-6);ctx.lineTo(cx-9,ty+2);ctx.lineTo(cx,ty-10);ctx.lineTo(cx+9,ty+2);ctx.lineTo(cx+18,ty-6);ctx.lineTo(cx+18,ty+8);ctx.fill();
  ctx.fillStyle='#ff4d6d';ctx.fillRect(cx-2,ty-2,4,4);
  if(b.state==='idle'&&b.tired>0&&b.st>0.3){ctx.fillStyle='#9fe6ff';const k=Math.floor(gtime*4)%3;ctx.fillRect(cx+hw-8,ty+6+k*5,4,6);ctx.fillRect(cx-hw+6,ty+10+((k+1)%3)*5,4,6);}
}

// ---- 3-4 흑기사 ----
function updDKnight(b,dt,dx){
  const ph2=b.hp<=b.maxHp/2;b.st-=dt;b.vy+=GRAV*dt;b.shield=b.state==='guard';
  switch(b.state){

// ---- 8-4 폭풍 그리폰 ----
function updGriffin(b,dt,dx){
  const ph2=b.hp<=b.maxHp/2,cx=b.x+b.w/2,cy=b.y+b.h/2;b.st-=dt;if(b.tx==null){b.tx=b.x;b.ty=b.y;}
  switch(b.state){
    case 'intro':hoverTo(b,dt);if(b.st<=0){nextMove(b,0.5);sfx('roar');}break;
    case 'move':hoverTo(b,dt);b.face=dx>0?1:-1;
      if(b.st<=0){const o=choose(b,['feathers','swoop','gust','feathers']);b.state=o;b.n=0;
        if(o==='swoop'){b.tx=P.x+P.w/2<15*T?24*T:3*T;b.ty=2*T;b.st=1.0;}else if(o==='gust'){b.st=2.2;b.wind=P.x+P.w/2<cx?-1:1;}else b.st=0.4;}break;
    case 'feathers':hoverTo(b,dt);if(b.st<=0){const n=ph2?7:5;for(let i=0;i<n;i++){const[vx,vy]=aimV(cx,cy,290,(i-(n-1)/2)*0.14);eShot(cx,cy,vx,vy,{col:'#e8dcc0',col2:'#ffffff',r:5,kind:'feather'});}sfx('arrow');b.n++;b.st=0.45;if(b.n>=(ph2?3:2))nextMove(b);}break;
    case 'swoop':if(b.n===0){hoverTo(b,dt,4);b.face=dx>0?1:-1;if(b.st<=0){b.n=1;b.st=0.5;}}
      else if(b.n===1){b.vx*=0.85;b.vy*=0.85;if(b.st<=0){b.n=2;const[vx,vy]=aimV(cx,cy,ph2?600:520);b.vx=vx;b.vy=vy;b.st=1.1;sfx('dive');}}
      else{if(Math.random()<0.7)parts.push({x:cx,y:cy,vx:0,vy:0,life:0.25,max:0.25,col:'#ffffff',size:4,grav:0});
        if(b.y+b.h>=14*T-4){b.vy=-Math.abs(b.vy)*0.8;}if(b.st<=0)nextMove(b,0.7);}break;
    case 'gust':hoverTo(b,dt);b.face=-b.wind;
      if(!P.dead&&P.dashT<=0)pushX(P,b.wind*(ph2?150:120)*dt);
      if(Math.random()<0.8)parts.push({x:b.wind>0?cam.x:cam.x+VW,y:cam.y+rand(40,VH-20),vx:b.wind*520,vy:0,life:1.3,max:1.3,col:'#e8f4ff',size:3,grav:0});
      if(ph2){b.n+=dt;if(b.n>0.5){b.n=0;const[vx,vy]=aimV(cx,cy,260);eShot(cx,cy,vx,vy,{col:'#e8dcc0',col2:'#ffffff',r:5,kind:'feather'});}}
      if(b.st<=0)nextMove(b,0.6);break;
  }
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.x=clamp(b.x,T,29*T-b.w);b.y=clamp(b.y,T,14*T-b.h);
}
function drawGriffin(b,x,y){
  const f=b.face,cx=x+b.w/2,cy=y+b.h/2,flap=Math.sin(gtime*(b.state==='gust'?22:10))*16,ph2=b.hp<=b.maxHp/2;
  ctx.fillStyle='#b08a4a';ctx.beginPath();ctx.moveTo(cx-f*20,cy);ctx.lineTo(cx-f*38,cy-10);ctx.lineTo(cx-f*36,cy+4);ctx.fill();
  ctx.fillStyle='#8a6a3a';ctx.beginPath();ctx.moveTo(cx-f*4,cy-6);ctx.lineTo(cx-f*30,cy-22-flap);ctx.lineTo(cx+f*10,cy-8);ctx.fill();
  ctx.fillStyle='#c9a05a';ctx.beginPath();ctx.ellipse(cx,cy+4,26,15,0,0,7);ctx.fill();
  ctx.fillStyle='#8a6a3a';ctx.fillRect(cx-14,cy+14,6,10);ctx.fillRect(cx+8,cy+14,6,10);
  ctx.fillStyle='#e8e4dc';ctx.beginPath();ctx.moveTo(cx+f*2,cy-4);ctx.lineTo(cx-f*22,cy-30+flap);ctx.lineTo(cx+f*18,cy-6);ctx.fill();
  const hx=cx+f*24,hy=cy-10;ctx.fillStyle='#f4f0e8';ctx.beginPath();ctx.arc(hx,hy,11,0,7);ctx.fill();
  ctx.fillStyle='#ffc23a';ctx.beginPath();ctx.moveTo(hx+f*8,hy-3);ctx.lineTo(hx+f*20,hy+3);ctx.lineTo(hx+f*8,hy+5);ctx.fill();
  ctx.fillStyle=ph2?'#ff3a3a':'#1a1a2a';ctx.fillRect(hx+f*3-2,hy-4,4,4);
}

// ---- 9-4 해골 사령술사 ----
function updNecro(b,dt,dx){
  const ph2=b.hp<=b.maxHp/2,cx=b.x+b.w/2,cy=b.y+b.h/2;b.st-=dt;if(b.fade==null)b.fade=1;
  b.y=14*T-b.h-14+Math.sin(gtime*2)*5;
  switch(b.state){
    case 'intro':if(b.st<=0){b.state='idle';b.st=0.6;sfx('roar');}break;
    case 'idle':b.face=dx>0?1:-1;if(b.st<=0){const mins=enemies.filter(e=>e.minion&&!e.dead).length;
      const o=choose(b,mins<3?['summon','bones','skulls','teleport']:['bones','skulls','teleport']);b.state=o;b.n=0;b.st=o==='summon'?0.8:o==='teleport'?0.35:0.4;}break;
    case 'summon':if(Math.random()<0.6)parts.push({x:cx+rand(-14,14),y:b.y,vx:0,vy:-60,life:0.5,max:0.5,col:'#6aff8a',size:3,grav:0});
      if(b.st<=0){const tx=Math.floor(cx/T);spawn({type:'archer',x:clamp(tx+(P.x<cx?-3:3),2,27),y:13});enemies[enemies.length-1].minion=true;enemies[enemies.length-1].drop=0;
        spawn({type:'bat',x:clamp(tx,2,27),y:6});const bt=enemies[enemies.length-1];bt.minion=true;bt.drop=0;bt.awake=true;sfx('roar');b.state='idle';b.st=ph2?0.7:1.0;}break;
    case 'bones':if(b.st<=0){const bx=cx+b.face*(44+b.n*44);if(bx>T&&bx<29*T)hazard('bone',bx-14,14*T-46,28,46,0.45,0.35,{});b.n++;b.st=0.13;if(b.n>=(ph2?9:6)){b.state='idle';b.st=0.8;}}break;
    case 'skulls':if(b.st<=0){const n=ph2?5:3;for(let i=0;i<n;i++){const a=-Math.PI/2+(i-(n-1)/2)*0.6;eShot(cx,cy,Math.cos(a)*180,Math.sin(a)*180,{homing:2.4,spd:ph2?150:125,col:'#d8ffd0',col2:'#3aff6a',r:8,life:6,kind:'skull'});}sfx('throw');b.state='idle';b.st=1.0;}break;
    case 'teleport':b.fade=Math.max(0,b.st/0.35);if(b.st<=0){let nx;do{nx=rand(3*T,26*T);}while(Math.abs(nx-P.x)<200);b.x=nx;b.state='appear';b.st=0.35;}break;
    case 'appear':b.fade=1-Math.max(0,b.st/0.35);if(b.st<=0){b.fade=1;b.state='idle';b.st=0.4;}break;
  }
  b.invuln=b.fade<0.5;b.noContact=b.fade<0.5;
}
function drawNecro(b,x,y){
  if(b.fade<0.5&&Math.floor(gtime*30)%2)return;
  const f=b.face,cx=x+b.w/2,cast=b.state==='summon'||b.state==='bones'||b.state==='skulls';
  ctx.fillStyle='#24142e';ctx.beginPath();ctx.moveTo(cx,y+4);ctx.lineTo(cx-17,y+50);ctx.lineTo(cx+17,y+50);ctx.fill();
  ctx.fillStyle='#4a2a6a';ctx.beginPath();ctx.moveTo(cx,y+16);ctx.lineTo(cx-8,y+50);ctx.lineTo(cx+8,y+50);ctx.fill();
  for(let i=0;i<5;i++){ctx.fillStyle='#24142e';ctx.fillRect(cx-17+i*7,y+48,5,4+((i+Math.floor(gtime*6))%2)*3);}
  ctx.fillStyle='#24142e';ctx.beginPath();ctx.arc(cx,y+10,12,0,7);ctx.fill();
  ctx.fillStyle='#e8e2cf';ctx.beginPath();ctx.arc(cx+f*2,y+12,7,0,7);ctx.fill();
  ctx.fillStyle=b.hp<=b.maxHp/2?'#ff3a3a':'#3aff6a';ctx.fillRect(cx+f*2-5,y+10,3,3);ctx.fillRect(cx+f*2+2,y+10,3,3);ctx.fillStyle='#2a1a1a';ctx.fillRect(cx+f*2-3,y+16,6,2);
  const sx=cx+f*16,ay=cast?-8:0;ctx.fillStyle='#5a4030';ctx.fillRect(sx-1,y+2+ay,3,46);
  ctx.fillStyle='#e8e2cf';ctx.beginPath();ctx.arc(sx,y-2+ay,6,0,7);ctx.fill();ctx.fillStyle=cast?'#6aff8a':'#2a1a1a';ctx.fillRect(sx-3,y-3+ay,2,2);ctx.fillRect(sx+1,y-3+ay,2,2);
}

// ---- 10-4 별을 삼킨 자 (3페이즈) ----
function updVoid(b,dt,dx){
  const r=b.hp/b.maxHp,ph=r>0.66?1:r>0.33?2:3;
  if(ph>b.phase){b.phase=ph;b.state='shift';b.st=1.4;b.vx=0;shake=16;sfx('roar');ringShot(b.x+b.w/2,b.y+b.h/2,24,200,0,VO);}
  b.st-=dt;b.invuln=b.state==='shift'||b.state==='tele';b.noContact=b.state==='tele';
  const cx=b.x+b.w/2,cy=b.y+b.h/2,gap=[0,0.6,0.42,0.3][ph];b.vy+=GRAV*dt;
  if(Math.random()<0.5)parts.push({x:cx+rand(-18,18),y:b.y+b.h-rand(0,40),vx:0,vy:-70,life:0.5,max:0.5,col:ph===3?'#ff4ad8':'#9a5cff',size:3,grav:0});
  if(ph===3&&b.state!=='shift'){b.met=(b.met||0)-dt;if(b.met<=0){b.met=0.6;const mx=Math.random()<0.5?P.x+P.w/2:rand(2*T,28*T);projs.push({kind:'icicle',owner:'e',x:mx-7,y:T+2,w:14,h:26,vx:0,vy:0,grav:true,gs:0.6,dmg:1,life:4,delay:0.6,col:'#c07aff'});}}
  switch(b.state){
    case 'intro':b.vx=0;if(b.st<=0){b.state='idle';b.st=0.5;sfx('roar');}break;
    case 'shift':b.vx=0;if(b.st<=0){b.state='idle';b.st=0.3;}break;
    case 'idle':b.face=dx>0?1:-1;b.vx=approach(b.vx,b.face*(ph>1?90:60),800*dt);
      if(b.st<=0){const pool=ph===1?['dash','ring','beam','slam']:ph===2?['dash','ring','beam','clones','homing','slam']:['dash','ring','beam','clones','homing','slam','beam','dash'];
        const o=choose(b,pool);b.n=0;
        if(o==='dash'){b.state='tele';b.st=0.3;}else if(o==='slam'){b.state='scrouch';b.st=ph===3?0.25:0.35;}else{b.state=o;b.st=o==='ring'?0.35:0.2;}}break;
    case 'tele':b.vx=0;if(b.st<=0){const left=P.x+P.w/2>15*T;b.x=left?2*T:27*T-b.w;b.y=14*T-b.h;b.face=left?1:-1;b.state='dwind';b.st=ph===3?0.3:0.42;sfx('select');}break;
    case 'dwind':b.vx=0;if(b.st<=0){b.state='dash';b.st=1.6;sfx('swing3');}break;
    case 'dash':b.vx=b.face*(ph===3?780:680);b.drop=(b.drop||0)-dt;if(ph>=2&&b.drop<=0){b.drop=0.09;eShot(cx,b.y+10,0,-140,Object.assign({grav:true,gs:0.35},VO));}
      if(b.hitWall||b.st<=0){b.state='rec';b.st=0.3;shake=8;if(ph===3)ringShot(cx,cy,12,170,0,VO);}break;
    case 'rec':b.vx=approach(b.vx,0,3000*dt);if(b.st<=0){b.state='idle';b.st=gap;}break;
    case 'ring':b.vx=0;if(b.st<=0){ringShot(cx,cy,[0,14,16,20][ph],[0,150,165,180][ph],b.n*0.21+(ph===3?gtime:0),VO);sfx('throw');b.n++;b.st=0.32;if(b.n>=[0,2,3,4][ph]){b.state='idle';b.st=gap;}}break;
    case 'beam':b.vx=0;if(b.st<=0){const py=P.y+P.h/2,dl=ph===3?0.6:0.75;
      hazard('beam',T,py-12,28*T,24,dl,0.35,{dmg:2,col:'#c07aff'});
      if(ph>=2)hazard('beam',P.x+P.w/2-12,T,24,13*T,dl+0.25,0.35,{dmg:2,col:'#c07aff',vert:true});
      if(ph===3)hazard('beam',T,(py<10*T?py+90:py-110)-12,28*T,24,dl+0.45,0.35,{dmg:2,col:'#ff6ad8'});
      sfx('select');b.state='idle';b.st=gap+dl+0.2;}break;
    case 'clones':b.vx=0;if(b.st<=0){const y=14*T-50,C=(x,vx,yy,d)=>projs.push({kind:'clone',owner:'e',x,y:yy,w:30,h:50,vx,vy:0,delay:d,life:1.8,dmg:1,pierce:true,noParry:true});
      C(T-40,620,y,0.55);C(29*T+10,-620,y,0.55);if(ph===3){C(T-40,620,7*T-50,0.95);C(29*T+10,-620,7*T-50,0.95);}
      sfx('select');b.state='idle';b.st=gap+0.9;}break;
    case 'homing':b.vx=0;if(b.st<=0){const n=ph===3?6:4;for(let i=0;i<n;i++){const a=-Math.PI/2+(i-(n-1)/2)*0.5;eShot(cx,cy,Math.cos(a)*200,Math.sin(a)*200,{homing:2.2,spd:ph===3?170:140,col:'#ff6ad8',col2:'#ffffff',r:7,life:6});}sfx('throw');b.state='idle';b.st=gap+0.4;}break;
    case 'scrouch':b.vx=0;if(b.st<=0){b.state='air';b.airT=0;b.vy=-900;b.vx=clamp(dx/1.0,-560,560);sfx('jump');}break;
    case 'air':b.airT+=dt;break;
  }
  moveBody(b,dt,false);
  if(b.state==='air'&&b.onG&&b.airT>0.12){shake=14;sfx('slam');quake(b,ph===3?380:320);if(ph>=2)ringShot(cx,b.y+b.h-10,10,160,0,VO);b.state='idle';b.st=gap;}
}
function drawVoid(b,x,y){
  if(b.state==='tele')return;
  if(b.state==='shift'&&Math.floor(gtime*20)%2)return;
  const f=b.face,cx=x+b.w/2,ph=b.phase||1,glow=ph===3?'#ff4ad8':'#9a5cff';
  const lean=b.state==='dash'?7:b.state==='dwind'?-3:0,crouch=b.state==='scrouch'?6:0,by=y+crouch,bx=cx+f*lean*0.5;
  ctx.fillStyle='#120a22';ctx.beginPath();ctx.moveTo(bx-f*8,by+14);ctx.lineTo(bx-f*(26+(b.state==='dash'?18:0)),by+60+Math.sin(gtime*7)*3);ctx.lineTo(bx+f*8,by+58);ctx.fill();
  ctx.fillStyle=glow;ctx.fillRect(bx-f*(26+(b.state==='dash'?18:0))-2,by+56+Math.sin(gtime*7)*3,4,4);
  const l=(Math.abs(b.vx)>20&&b.onG)?Math.sin(gtime*14)*4:0;ctx.fillStyle='#0c0818';ctx.fillRect(cx-10+l,y+42,8,16);ctx.fillRect(cx+2-l,y+42,8,16);
  ctx.fillStyle='#1a1430';rr(bx-14,by+16,28,28,5);ctx.fill();ctx.fillStyle=glow;ctx.fillRect(bx-14,by+20,28,2);ctx.fillRect(bx-2,by+26,4,10);
  const hx=bx+f*lean*0.5;ctx.fillStyle='#1a1430';rr(hx-10,by,20,18,5);ctx.fill();
  ctx.fillStyle='#ffffff';ctx.fillRect(hx+f*3-6,by+7,4,4);ctx.fillRect(hx+f*3+2,by+7,4,4);
  ctx.fillStyle=glow;for(let i=0;i<5;i++){const sx=hx-10+i*5;ctx.beginPath();ctx.moveTo(sx,by+1);ctx.lineTo(sx+2.5,by-8-(i===2?6:i%2?0:3));ctx.lineTo(sx+5,by+1);ctx.fill();}
  const A={idle:0.8,dwind:-2.4,dash:0,ring:-1.57,beam:-1.57,clones:-1.2,homing:-1.2,scrouch:-2.0,rec:0.5,shift:-1.57,intro:0.8}[b.state];
  bigBlade(bx+f*12,by+30,f,b.state==='air'?-1.6:(A==null?0.8:A),34,'#e0d4ff',glow);
}

function genLevel(w,s){
  const R=rng(w*1000+s*77+13),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)];
  const W=WORLDS[w-1],diff=(w-1)+(s-1)*0.6,width=130+w*6+s*8,L=mk(width,17);
  const top=W.ceil?(L.r(0,0,width-1,1),4):2;
  let g=13,x=0;L.gr(0,9,g);L.start=[3,g-1];x=10;
  const flags=[Math.floor(width*0.36),Math.floor(width*0.68)];let fi=0,lastStar=0;
  const enemy=(ex,eg)=>{const t=pick(W.enemies);if(t==='bat')L.e('bat',ex,Math.max(top+1,eg-ri(4,6)));else L.e(t,ex,eg-1);};
  const star=(sx,sy)=>{if(sx-lastStar>12){L.e('star',sx,sy);lastStar=sx;}};
  const segs=['flat','flat','pit','spikes','step','plats','wall'];
  while(x<width-22){
    if(fi<2&&x>=flags[fi]){L.gr(x,x+6,g);L.e('flag',x+1,g-1);if(R()<0.5)L.e('potion',x+4,g-1);x+=7;fi++;continue;}
    const seg=pick(segs);
    if(seg==='flat'){const len=ri(9,15);L.gr(x,x+len-1,g);
      const n=1+(diff>3?1:0)+(diff>7&&R()<0.6?1:0);for(let i=0;i<n;i++)enemy(x+3+Math.floor((len-5)*(i+0.5)/n),g);
      if(R()<0.5){const px=x+ri(2,len-6),py=g-3;L.p(px,px+3,py).coins(px,px+3,py-1);if(R()<0.5)star(px+1,py-2);}
      else L.coins(x+2,x+4,g-2);
      if(R()<0.22)L.e('chest',x+len-3,g-1);
      x+=len;}
    else if(seg==='pit'){const gap=ri(2,diff>5?4:3),g2=clamp(g+ri(-2,2),top+6,14);
      if(gap>=4)L.p(x+1,x+2,Math.min(g,g2)-1);
      L.coins(x,x+gap-1,Math.min(g,g2)-3);x+=gap;g=g2;L.gr(x,x+3,g);x+=4;}
    else if(seg==='spikes'){const len=ri(3,diff>4?6:5);L.gr(x,x+len-1,g+2).sp(x,x+len-1,g+1);
      if(len>=5){L.p(x+1,x+3,g-2);star(x+2,g-3);}L.gr(x+len,x+len+2,g);x+=len+3;}
    else if(seg==='step'){const g2=clamp(g+pick([-3,-2,2,3]),top+6,14),len=ri(6,10);g=g2;L.gr(x,x+len-1,g);
      if(R()<0.6)enemy(x+ri(2,len-2),g);x+=len;}
    else if(seg==='plats'){const len=ri(8,12+(diff>4?2:0));let px=x+1,h=g-1;
      while(px<x+len-3){L.p(px,px+2,h).coins(px,px+2,h-1);if(R()<0.3)star(px+1,h-2);px+=ri(4,5);h=clamp(h+pick([-2,-1,1,2]),top+5,g-1);}
      if(diff>2&&R()<0.7)L.e('bat',x+Math.floor(len/2),Math.max(top+1,g-6));
      x+=len;g=clamp(g+ri(-1,1),top+6,14);L.gr(x,x+3,g);x+=4;}
    else if(seg==='wall'){const len=ri(9,12),hh=ri(3,diff>3?6:4);L.gr(x,x+len-1,g);const wx=x+ri(3,len-5);
      L.r(wx,g-hh,wx+1,g-1).coins(wx,wx+1,g-hh-1);if(hh>=5)L.p(wx-3,wx-2,g-3);star(wx,g-hh-2);
      if(R()<0.6)enemy(wx+3,g);x+=len;}
  }
  L.gr(x,width-1,g);enemy(x+4,g);L.e('exit',width-5,g-1);
  return L;
}

function tileAt(tx,ty){if(tx<0||tx>=lvl.w)return '#';if(ty<0||ty>=lvl.h)return ' ';return lvl.g[ty][tx];}
function solid(tx,ty){return tileAt(tx,ty)==='#';}
function moveBody(b,dt,oneWay=true){
  b.hitWall=0;
  let nx=b.x+b.vx*dt;
  const y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-0.01)/T);
  if(b.vx>0){const tx=Math.floor((nx+b.w-0.01)/T);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){nx=tx*T-b.w;b.vx=0;b.hitWall=1;break;}}
  else if(b.vx<0){const tx=Math.floor(nx/T);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){nx=(tx+1)*T;b.vx=0;b.hitWall=-1;break;}}
  b.x=nx;
  const bottom=b.y+b.h;let ny=b.y+b.vy*dt;b.onG=false;b.hitCeil=false;
  const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-0.01)/T);
  if(b.vy>0){const ty=Math.floor((ny+b.h-0.01)/T);
    for(let tx=x0;tx<=x1;tx++){const t=tileAt(tx,ty);
      if(t==='#'||(t==='='&&oneWay&&!b.dropping&&bottom<=ty*T+1)){ny=ty*T-b.h;b.vy=0;b.onG=true;break;}}}
  else if(b.vy<0){const ty=Math.floor(ny/T);for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){ny=(ty+1)*T;b.vy=0;b.hitCeil=true;break;}}
  b.y=ny;
}
function groundAhead(e,dir){
  const fx=dir>0?e.x+e.w+2:e.x-2,ty=Math.floor((e.y+e.h+4)/T),t=tileAt(Math.floor(fx/T),ty);
  return t==='#'||t==='=';
}
function onSafe(p){
  const ty=Math.floor((p.y+p.h+2)/T),ok=t=>t==='#'||t==='=';
  if(!ok(tileAt(Math.floor((p.x-6)/T),ty))||!ok(tileAt(Math.floor((p.x+p.w+6)/T),ty)))return false;
  for(let y=Math.floor(p.y/T);y<ty;y++)for(const x of[Math.floor((p.x-6)/T),Math.floor((p.x+p.w+6)/T)])if(tileAt(x,y)==='^')return false;
  return true;
}
function onOneWay(p){
  const ty=Math.floor((p.y+p.h+2)/T),a=tileAt(Math.floor((p.x+1)/T),ty),b=tileAt(Math.floor((p.x+p.w-1)/T),ty);
  return a!=='#'&&b!=='#'&&(a==='='||b==='=');
}

      if(k.hitWall)k.vx=-k.hitWall*60;
      if(k.y>lvl.h*T+40)k.dead=true;
    }
    const cx=k.x+k.w/2,cy=k.y+k.h/2,d=Math.hypot(pcx-cx,pcy-cy);

    if(!P.dead&&ov(k,P)&&(k.type!=='coin'&&k.type!=='star'||k.static||k.t>0.25)&&!(k.type==='star'&&G.stars>=starCap())){
      k.dead=true;

    }
  }

const SUPA={url:'',key:''};
const RANK={mode:'off',db:null,user:null,uid:null,rows:[],names:{},status:'loading',writing:false,writeErr:false,lastFetch:0};
const BKEY='starknight_best_v1';
function rankScore(cleared,time){return cleared*100000+Math.max(0,99999-Math.floor(time));}
function stageLabel(n){return n>=STAGES.length?'완주':STAGES[n].name.split(' ')[0];}
function fmtTime(t){t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}

function submitScore(){
  const rec={cleared:G.unlocked,time:Math.round(G.time),kills:G.kills,deaths:G.deaths,score:rankScore(G.unlocked,G.time),at:Date.now()};
  const lb=localBest();if(!lb||rec.score>lb.score){try{localStorage.setItem(BKEY,JSON.stringify(rec));}catch(e){}}
  if(RANK.mode==='web'){webSubmit(rec);return;}
  if(!RANK.db||!RANK.uid||RANK.writing)return;
  const mine=RANK.rows.find(r=>r.id===RANK.uid);if(mine&&mine.score>=rec.score)return;
  RANK.writing=true;RANK.db.doc('scores/'+RANK.uid).set(rec).then(()=>{RANK.writeErr=false;}).catch(()=>{RANK.writeErr=true;}).finally(()=>{RANK.writing=false;});
}
function resolveNames(){
  if(!RANK.user)return;const ids=RANK.rows.slice(0,30).map(r=>r.id);if(RANK.uid&&!ids.includes(RANK.uid))ids.push(RANK.uid);
  RANK.user.profiles(ids).then(ps=>{for(const id of ids)if(ps&&ps[id])RANK.names[id]=ps[id].name||'';}).catch(()=>{});

function webIdent(){
  let v=null;try{v=JSON.parse(localStorage.getItem('starknight_pid'));}catch(e){}

    try{localStorage.setItem('starknight_pid',JSON.stringify(v));}catch(e){}}
  return v;
}

function update(dt){

  else if(state==='clear'){updWorld(dt*0.3);if(stateT>2.2)setState('shop');}

function updPlay(dt){
  if(pressed.pause){setState('pause');return;}
  if(ultFX){updUlt(dt);for(const c of cuts)c.t+=dt;cuts=cuts.filter(c=>c.t<0.4);shake=Math.max(0,shake-dt*20);return;}
  if(freeze>0){freeze-=dt;return;}
  G.time+=dt;bannerT-=dt;
  updPlayer(dt);
  updWorld(dt);
  if(P.dead){P.deadT-=dt;if(P.deadT<=0)setState('dead');}
  if(boss&&boss.dead&&winT>0){winT-=dt;if(winT<=0){if(G.stage>=STAGES.length-1){G.unlocked=STAGES.length;save();submitScore();sfx('clear');setState('victory');}else stageClear();}}
}
function updWorld(dt){
  for(const e of enemies)updEnemy(e,dt);
  enemies=enemies.filter(e=>!e.dead);
  updProjs(dt);updPickups(dt);updProps(dt);
  for(const p of parts){p.life-=dt;p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  parts=parts.filter(p=>p.life>0);
  for(const t of texts){t.life-=dt;t.y-=40*dt;}texts=texts.filter(t=>t.life>0);
  for(const g of ghosts)g.life-=dt;ghosts=ghosts.filter(g=>g.life>0);
  for(const k of sparks)k.t+=dt;sparks=sparks.filter(k=>k.t<0.22);
  for(const c of cuts)c.t+=dt;cuts=cuts.filter(c=>c.t<0.4);
  const focusX=(boss&&!boss.dead)?(P.x+P.w/2)*0.55+(boss.x+boss.w/2)*0.45:P.x+P.w/2+P.face*40;
  const tx=clamp(focusX-VW/2,0,Math.max(0,lvl.w*T-VW));
  const focusY=(boss&&!boss.dead)?(P.y+P.h/2)*0.6+(boss.y+boss.h/2)*0.4+VH*0.08:P.y+P.h/2;
  const ty=clamp(focusY-VH*0.66,0,Math.max(0,lvl.h*T-VH));
  cam.x+=(tx-cam.x)*Math.min(1,dt*6);
  cam.y+=(ty-cam.y)*Math.min(1,dt*5);
  shake=Math.max(0,shake-dt*30);
}

function hexRGB(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function bandSky(stops,n=14){
  const bh=Math.ceil(H/n/SC)*SC;
  for(let i=0;i*bh<H;i++){const t=Math.min(1,i/(n-1));let j=0;while(j<stops.length-2&&t>stops[j+1][0])j++;
    const[a0,c0]=stops[j],[a1,c1]=stops[j+1],k=clamp((t-a0)/(a1-a0),0,1),A=hexRGB(c0),B=hexRGB(c1);
    ctx.fillStyle='rgb('+A.map((v,q)=>Math.round(v+(B[q]-v)*k)).join(',')+')';ctx.fillRect(0,i*bh,W,bh);}
}
function hills(par,base,amp,f1,f2,col,yOff=0){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=16){const wx=x+cam.x*par;ctx.lineTo(x,base+yOff+Math.sin(wx*f1)*amp+Math.sin(wx*f2+1.3)*amp*0.5);}
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}

      const c=['#7ff0ff','#c58bff','#ff8bd8'][i%3+3>2?Math.abs(i)%3:0];
      ctx.globalAlpha=0.25*a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,s*2.4,0,7);ctx.fill();ctx.globalAlpha=0.9;
      ctx.beginPath();ctx.moveTo(x,y-s*1.6);ctx.lineTo(x+s*0.6,y);ctx.lineTo(x,y+s*0.6);ctx.lineTo(x-s*0.6,y);ctx.closePath();ctx.fill();ctx.globalAlpha=1;}
  }else if(theme==='castle'){

      ctx.beginPath();ctx.moveTo(x-6,380-h);ctx.lineTo(x+w/2,380-h-50);ctx.lineTo(x+w+6,380-h);ctx.fill();
      if(hash(i+7)>0.4){ctx.fillStyle='#ffd27a';ctx.fillRect(x+w/2-4,380-h+30,8,12);ctx.fillStyle='#4a2d55';}}
    ctx.fillStyle='#352043';const off=-(cam.x*0.45)%40;ctx.fillRect(0,400,W,H);for(let x=off-40;x<W+40;x+=40)ctx.fillRect(x,384,22,20);
  }else{ // boss
    bandSky([[0,'#1a1424'],[1,'#2e2436']],6);
    for(let i=0;i<4;i++){const x=140+i*230;ctx.fillStyle='#120d1a';rr(x-40,100,80,200,40);ctx.fill();
      ctx.fillStyle='rgba(120,90,200,0.25)';rr(x-32,110,64,182,32);ctx.fill();
      const f=0.7+0.3*Math.sin(gtime*12+i*2);ctx.fillStyle='rgba(255,160,60,'+(0.18*f)+')';ctx.beginPath();ctx.arc(x+115,250,40,0,7);ctx.fill();
      ctx.fillStyle='#5a4030';ctx.fillRect(x+111,250,8,24);ctx.fillStyle='#ffb347';ctx.beginPath();ctx.ellipse(x+115,244,6*f,11*f,0,0,7);ctx.fill();}

function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function makeSprite(rows,pal){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length)),c=cnv(w,h),x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const col=pal[rows[j][i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}
  const f=cnv(w,h),fx=f.getContext('2d');fx.scale(-1,1);fx.drawImage(c,-w,0);
  return{c,f,w,h,tints:{}};
}
function tinted(S,col,face){const k=col+(face<0?'L':'R');if(!S.tints[k]){const o=cnv(S.w,S.h),x=o.getContext('2d');x.drawImage(face<0?S.f:S.c,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,S.w,S.h);S.tints[k]=o;}return S.tints[k];}
// x,y: 왼쪽 위 (게임 좌표)
function spr(S,x,y,face=1,white=false,k=1){
  const img=white?tinted(S,'#ffffff',face):(face<0?S.f:S.c);
  ctx.drawImage(img,Math.round(x/PX)*PX,Math.round(y/PX)*PX,S.w*PX*k,S.h*PX*k);
}

function beginLayer(L,clear,world=true){ctx=L.x;ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';if(clear)ctx.clearRect(0,0,LW,LH);ctx._z=world?ZOOM:1;ctx.setTransform(world?1/PX:1/SC,0,0,world?1/PX:1/SC,0,0);ctx.imageSmoothingEnabled=false;}
// 반투명 가장자리를 없애고 1픽셀 어두운 테두리를 그림
function pixelate(L){
  const img=L.x.getImageData(0,0,LW,LH),d=new Uint32Array(img.data.buffer),m=PXMASK,n=d.length;
  for(let i=0;i<n;i++){if((d[i]>>>24)<120){d[i]=0;m[i]=0;}else{d[i]|=0xff000000;m[i]=1;}}
  for(let y=0;y<LH;y++){const r=y*LW;for(let x=0;x<LW;x++){const i=r+x;if(m[i])continue;
    if((x>0&&m[i-1])||(x<LW-1&&m[i+1])||(y>0&&m[i-LW])||(y<LH-1&&m[i+LW]))d[i]=OUTLINE;}}
  L.x.putImageData(img,0,0);
}
function beginMain(){ctx=mainCtx;ctx.setTransform(RS,0,0,RS,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.imageSmoothingEnabled=false;ctx._z=1;}
function blit(L){mainCtx.setTransform(RS,0,0,RS,0,0);mainCtx.globalAlpha=1;mainCtx.imageSmoothingEnabled=false;mainCtx.drawImage(L.c,0,0,W,H);}
function flushText(){ctx=mainCtx;mainCtx.setTransform(RS,0,0,RS,0,0);for(const q of textQ){mainCtx.globalAlpha=q[7];txt(q[0],q[1],q[2],q[3],q[4],q[5],q[6]);}mainCtx.globalAlpha=1;textQ=[];}
function drawWorld(){
  const sx=shake>0?Math.round(rand(-shake,shake)/PX)*PX:0,sy=shake>0?Math.round(rand(-shake,shake)/PX)*PX:0;
  const camX=cam.x,camY=cam.y;cam.x=Math.round(cam.x/PX)*PX;cam.y=Math.round(cam.y/PX)*PX;
  beginLayer(BG,false,false);ctx.translate(sx*ZOOM,sy*ZOOM);
  drawBG(stage.theme);
  beginLayer(FG,true);ctx.translate(sx,sy);
  if(stage.theme==='lava'||stage.theme==='swamp'){const lv=stage.theme==='lava',ly=Math.round((15.4*T-cam.y)/PX)*PX;
    ctx.fillStyle=lv?'#e8481a':'#2f4a26';ctx.fillRect(0,ly,VW,VH);ctx.fillStyle=lv?'#ffc23a':'#5a7a3a';
    for(let x=0;x<VW;x+=PX*2){const h=Math.round((Math.sin((x+cam.x)*0.05+gtime*3)+1)*1.5)*PX;ctx.fillRect(x,ly-h,PX*2,h+PX);}}
  drawTiles();
  for(const o of props)drawProp(o);
  for(const k of pickups){const x=k.x-cam.x,y=k.y-cam.y+(k.static?Math.sin(k.t*3)*2:0);
    if(k.life!=null&&k.life<2&&Math.floor(k.t*10)%2)continue;
    if(k.type==='coin')drawCoin(x+k.w/2,y+k.h/2,k.t);else if(k.type==='star')spr(STARP[Math.floor(k.t*6)%2],x,y);else drawPotion(x,y);}

  if(!P.dead&&!(P.inv>0&&Math.floor(P.inv*14)%2))drawKnight(P.x+P.w/2-cam.x,P.y+P.h-cam.y,P.face,P);
  for(const pr of projs)drawProj(pr);
  for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.fillRect(p.x-cam.x-p.size/2,p.y-cam.y-p.size/2,p.size,p.size);}
  ctx.globalAlpha=1;

  if(state==='play'){drawBanner();drawUltFX();drawSkillBanner();}
  if(state==='pause'){dim(0.55);txt('일시정지',W/2,150,44,'#fff','center');drawButtons();}
  else if(state==='dead'){dim(0.6);txt('쓰러졌다…',W/2,190,48,'#ff8a8a','center');txt('별빛은 아직 꺼지지 않았다',W/2,245,18,'#ddd','center');drawButtons();}
  else if(state==='clear'){dim(Math.min(0.5,stateT));txt('스테이지 클리어!',W/2,H/2-30,52,'#ffe066','center');txt('+'+(G.coins-G.stageCoins0)+' 코인',W/2,H/2+30,22,'#fff','center');}
  else if(state==='shop')drawShop();
  else if(state==='victory')drawVictory();
  flushText();
}
function dim(a){ctx.fillStyle='rgba(8,6,16,'+a+')';ctx.fillRect(0,0,W,H);}
function drawTitle(rank){
  cam.x=Math.round(gtime*40/SC)*SC;beginLayer(BG,false,false);drawBG('title');
  beginLayer(FG,true);
  for(let tx=0;tx<VW/T;tx++)for(let ty=0;ty<3;ty++)ctx.drawImage((ty?TILES.forest.fill:TILES.forest.top)[Math.floor(hash(tx*3+ty)*4)],tx*T,296+ty*T,T,T);
  drawKnight(VW/2,296,1,{anim:gtime,onG:true,vx:0,atkT:0});
  for(let i=0;i<6;i++){const a=gtime*1.5+i*1.05;drawStar(VW/2+Math.cos(a)*44,276+Math.sin(a)*14,5,a,'#ffe066');}
  pixelate(FG);blit(BG);blit(FG);
  beginMain();
  if(rank){drawRank();flushText();return;}
  txt('삼도류 검사',W/2,130,80,'#ffe066','center');
  txt('THREE-SWORD STYLE',W/2,195,22,'#fff','center');
  drawButtons();
  txt(isTouch?'버튼을 눌러 시작':'←/→ 선택 · Enter 또는 J 결정 · M 소리 끄기',W/2,515,14,'rgba(255,255,255,0.85)','center');
  flushText();
}
function gearIcon(cat,i,cx,cy){
  if(cat==='sword'){const S=SWORDS[i],L=34+S.reach;ctx.save();ctx.translate(cx-L/2-4,cy+L/4);ctx.rotate(-0.55);
    ctx.fillStyle='#6b4a2b';ctx.fillRect(-8,-3,10,6);ctx.fillStyle=S.guard;ctx.fillRect(2,-9,5,18);ctx.fillStyle=S.blade;ctx.fillRect(7,-4,L,8);ctx.beginPath();ctx.moveTo(7+L,-4);ctx.lineTo(15+L,0);ctx.lineTo(7+L,4);ctx.fill();ctx.fillStyle=S.edge;ctx.fillRect(7,1,L,3);ctx.restore();}
  else if(cat==='star'){const S=STARS[i],sp=S.spread||[0];sp.slice(0,3).forEach((a,k)=>drawStar(cx+(sp.length>1?(k-(Math.min(3,sp.length)-1)/2)*16:0),cy+a*40,S.big?17:12,gtime+k,S.col));}
  else{const A=ARMORS[i];ctx.fillStyle=A.d;rr(cx-20,cy-18,40,36,8);ctx.fill();ctx.fillStyle=A.s;rr(cx-16,cy-15,32,30,6);ctx.fill();ctx.fillStyle=A.w;ctx.fillRect(cx-12,cy-12,10,8);ctx.fillStyle=A.d;ctx.fillRect(cx-16,cy+4,32,4);ctx.fillStyle='#ffd23f';ctx.fillRect(cx-3,cy-6,6,6);}
}
function gearStat(cat,i){
  if(cat==='sword'){const S=SWORDS[i];return'공격력 '+S.dmg+(S.reach?'  · 사거리 +'+S.reach:'');}
  if(cat==='star'){const S=STARS[i];return'위력 '+S.dmg+' · '+S.desc;}
  const A=ARMORS[i];return'체력 '+A.hp+(A.inv?'  · 무적 +'+A.inv+'초':'');
}
function drawShop(){
  dim(0.85);txt('떠돌이 대장장이의 상점',W/2,30,26,'#ffe066','center');
  drawCoin(W/2-110,62,gtime,1.2);txt(String(G.coins),W/2-90,63,20,'#ffe066');txt('Lv '+G.lv+' · 공격력 '+swordDmg()+' · 체력 '+(curArmor().hp+lvHp()),W/2+40,63,15,'#bfe0ff');
  buttons.forEach((b,i)=>{const sel=i===menuSel;
    if(b.tab){const on=b.tab===shopTab;ctx.fillStyle=on?'#ffd84a':'rgba(36,28,60,0.95)';rr(b.x,b.y,b.w,b.h,10);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=sel?'#ffffff':'rgba(255,255,255,0.3)';ctx.stroke();
      txt(b.tab==='forge'?b.label:b.label+' '+G.owned[b.tab].length+'/10',b.x+b.w/2,b.y+b.h/2+1,17,on?'#2a1a08':'#ffffff','center',false);return;}
    if(b.forge!=null){const SW=swordOf(G.eq.sword[b.forge]),L=SW.lv,gr=GRADES[SW.grade],mx=L>=10,c=mx?0:forgeCost(SW.idx,L),can=!mx&&G.coins>=c,fl=forgeFlash.slot===b.forge&&gtime-forgeFlash.t<0.6;
      ctx.fillStyle=fl?'rgba(120,100,40,0.98)':sel?'rgba(70,56,110,0.98)':'rgba(36,28,60,0.95)';rr(b.x,b.y,b.w,b.h,14);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=sel?'#ffd84a':gr.c;ctx.stroke();
      const cx=b.x+b.w/2;txt(SLOTS[b.forge],cx,b.y+22,14,'#9a90c0','center');
      if(SW.grade>=2){ctx.fillStyle=gr.c;ctx.globalAlpha=0.25+0.15*Math.sin(gtime*4);ctx.beginPath();ctx.arc(cx,b.y+70,40,0,7);ctx.fill();ctx.globalAlpha=1;}
      ctx.save();ctx.translate(cx-34,b.y+86);ctx.rotate(-0.55);ctx.fillStyle='#6b4a2b';ctx.fillRect(-10,-4,12,8);ctx.fillStyle=SW.guard;ctx.fillRect(2,-11,6,22);ctx.fillStyle=SW.blade;ctx.fillRect(8,-5,64,10);ctx.beginPath();ctx.moveTo(72,-5);ctx.lineTo(82,0);ctx.lineTo(72,5);ctx.fill();ctx.fillStyle=SW.edge;ctx.fillRect(8,1,64,4);ctx.restore();
      txt(SW.name+(L?' +'+L:''),cx,b.y+128,19,'#ffffff','center');txt(gr.n,cx,b.y+152,15,gr.c,'center');
      txt('공격력 '+SW.dmg+' · 사거리 +'+SW.reach,cx,b.y+178,13,'#cfc7e8','center');
      for(let j=0;j<10;j++){ctx.fillStyle=j<L?GRADES[gradeOf(j+1)].c:'rgba(255,255,255,0.15)';ctx.fillRect(cx-100+j*20,b.y+196,16,8);}
      txt(mx?'최대 강화':'다음: 공격력 +1 · 사거리 +1'+(gradeOf(L+1)>SW.grade?' · '+GRADES[gradeOf(L+1)].n+' 각성!':''),cx,b.y+222,12,mx?'#9ff0a0':'#bfe0ff','center');
      txt(mx?'신검':'강화 '+c+' 코인',cx,b.y+254,17,mx?'#ffffff':can?'#ffe066':'#ff8a8a','center');return;}
    if(b.slot!=null){const on=b.slot===swordSlot;ctx.fillStyle=on?'#9fe6ff':'rgba(36,28,60,0.95)';rr(b.x,b.y,b.w,b.h,8);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=sel?'#ffffff':'rgba(255,255,255,0.3)';ctx.stroke();
      txt(b.label+' · '+SWORDS[G.eq.sword[b.slot]].name,b.x+b.w/2,b.y+b.h/2+1,13,on?'#10202a':'#ffffff','center',false);return;}
    if(b.item==null)return;
    const cat=shopTab,it=GEAR[cat][b.item],own=G.owned[cat].includes(b.item),can=G.coins>=it.cost;
    const inSlots=cat==='sword'?SLOTS.filter((_,k)=>G.eq.sword[k]===b.item):[],eq=cat==='sword'?inSlots.length>0:G.eq[cat]===b.item;
    ctx.fillStyle=eq?'rgba(40,80,60,0.98)':sel?'rgba(70,56,110,0.98)':'rgba(36,28,60,0.95)';rr(b.x,b.y,b.w,b.h,12);ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle=sel?'#ffd84a':eq?'#9ff0a0':'rgba(255,255,255,0.22)';ctx.stroke();
    gearIcon(cat,b.item,b.x+b.w/2,b.y+36);
    txt(it.name+(cat==='sword'&&forgeLv(b.item)?' +'+forgeLv(b.item):''),b.x+b.w/2,b.y+70,15,'#ffffff','center');txt(gearStat(cat,b.item),b.x+b.w/2,b.y+89,11,'#cfc7e8','center');
    txt(eq?(cat==='sword'?inSlots.join('·'):'장착 중'):own?(cat==='sword'?SLOTS[swordSlot]+'에 끼우기':'장착하기'):it.cost+' 코인',b.x+b.w/2,b.y+110,14,eq?'#9ff0a0':own?'#bfe0ff':can?'#ffe066':'#ff8a8a','center');});
  drawButtons();
  txt(shopTab==='forge'?'카드를 누르면 지금 낀 칼을 강화해요 · +3 명검 · +6 대명검 · +9 전설 · +10 신검':isTouch?'칼은 칸(오른손·왼손·입)을 고른 뒤 카드를 눌러 끼워요':'←/→ 선택 · J/Enter 구매·장착',W/2,524,13,'rgba(255,255,255,0.7)','center');
}
function drawVictory(){
  dim(0.75);
  for(let i=0;i<14;i++){const a=gtime*0.6+i*0.45;drawStar(W/2+Math.cos(a)*(200+i*10),200+Math.sin(a*1.3)*120,5,a,'rgba(255,230,120,0.8)');}
  txt('승리!',W/2,120,72,'#ffe066','center');
  txt('별을 삼킨 자를 쓰러뜨리고 밤하늘에 별빛이 돌아왔다.',W/2,190,20,'#fff','center');
  const m=Math.floor(G.time/60),s=Math.floor(G.time%60);
  txt('플레이 시간  '+m+'분 '+s+'초',W/2,250,20,'#ddd','center');
  txt('처치한 적  '+G.kills,W/2,285,20,'#ddd','center');
  txt('모은 코인  '+G.coins+'   ·   쓰러진 횟수  '+G.deaths,W/2,320,20,'#ddd','center');

}

// ================= 루프 =================
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(0.1,(now-last)/1000);last=now;
  while(acc>=STEP){update(STEP);acc-=STEP;}
  render();requestAnimationFrame(frame);
}
setState('title');
requestAnimationFrame(frame);
window.__game={STAGES,BOSSES,get lvl(){return lvl},get projs(){return projs},get state(){return state},get P(){return P},get G(){return G},get enemies(){return enemies},get boss(){return boss},startStage,press,release,setState};
