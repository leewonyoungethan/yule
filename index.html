<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나율이 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 휴대폰 게임처럼 가운데 한 줄 — 나이 HUD, 원근감 있는 방, 상태 링, 탭으로 나뉜 할 일 버튼, 재능과 일기 */
:root {
  --bg-top: #cfe6fb;
  --bg-bot: #f4f8fc;
  --surface: #ffffff;
  --surface-2: #f1f5fa;
  --ink: #23283a;
  --muted: #677087;
  --line: #dde4ee;
  --accent: #ff7452;
  --accent-2: #2f9e8f;
  --accent-ink: #ffffff;
  --warn: #d9480f;
  --good: #2b8a3e;
  --s-hunger: #f08c2e;
  --s-happy: #e8547f;
  --s-clean: #3d8fe0;
  --s-energy: #e0a91b;
  --s-health: #2fb36a;
  --track: #e6ebf2;
  --shadow: 0 2px 0 rgba(35, 40, 58, .06), 0 10px 28px rgba(35, 40, 58, .09);
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-top: #142038; --bg-bot: #0e1422; --surface: #1b2236; --surface-2: #242c44; --ink: #eef1fa; --muted: #a3abc4; --line: #323b57;
    --accent: #ff8a6b; --accent-2: #4cc3b2; --accent-ink: #1a1012; --warn: #ff9b5e; --good: #6ad48a; --track: #2c3550;
    --s-hunger: #f5a04d; --s-happy: #f17198; --s-clean: #62a8f0; --s-energy: #f0c040; --s-health: #4fd08a;
    --shadow: 0 2px 0 rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-top: #142038; --bg-bot: #0e1422; --surface: #1b2236; --surface-2: #242c44; --ink: #eef1fa; --muted: #a3abc4; --line: #323b57;
  --accent: #ff8a6b; --accent-2: #4cc3b2; --accent-ink: #1a1012; --warn: #ff9b5e; --good: #6ad48a; --track: #2c3550;
  --s-hunger: #f5a04d; --s-happy: #f17198; --s-clean: #62a8f0; --s-energy: #f0c040; --s-health: #4fd08a;
  --shadow: 0 2px 0 rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg-bot); }
body {
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bot) 420px) no-repeat, var(--bg-bot);
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
}
button { font: inherit; color: inherit; }
button:focus-visible, .kid:focus-visible, input:focus-visible + .sw { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.card { background: var(--surface); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; margin: 0; }

/* HUD */
.hud { display: flex; align-items: center; gap: 10px; }
.who { display: grid; line-height: 1.1; }
.who .brand { font-family: var(--f-display); font-size: .85rem; color: var(--accent); letter-spacing: .02em; }
.who b { font-family: var(--f-display); font-weight: 400; font-size: 2rem; }
.who b small { font-size: 1rem; color: var(--muted); margin-left: 4px; }
.hud .right { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.chip { background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .88rem; box-shadow: var(--shadow); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip b { font-family: var(--f-display); font-weight: 400; color: var(--accent); font-size: 1rem; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--surface); box-shadow: var(--shadow); cursor: pointer; font-size: 1.1rem; display: grid; place-items: center; }

/* 방 */
.stage { position: relative; width: 100%; aspect-ratio: 3 / 2; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); background: #e9e3d9; }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.kid { position: absolute; left: 52%; transform: translateX(-50%); transform-origin: bottom center; cursor: pointer; border-radius: 10px; transition: height .8s ease, width .8s ease; z-index: 2; }
.kid svg { width: 100%; height: 100%; display: block; overflow: visible; transform-origin: 50% 100%; animation: breathe 3.4s ease-in-out infinite; }
.kid .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.006, 1.014); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
.kid.bounce { animation: hop .55s ease; }
@keyframes hop { 0%, 100% { transform: translateX(-50%); } 35% { transform: translateX(-50%) translateY(-8%); } 70% { transform: translateX(-50%) translateY(0) scale(1.03, .97); } }
.shadow { position: absolute; left: 52%; transform: translateX(-50%); height: 10px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(40,25,15,.38), rgba(40,25,15,0) 70%); z-index: 1; pointer-events: none; }
.nowline { position: absolute; border-top: 2px dashed rgba(255,116,82,.8); pointer-events: none; transition: bottom .8s ease; z-index: 1; }
.nowline span { position: absolute; left: 0; top: -22px; font-family: var(--f-display); font-size: 12px; color: #fff; background: #ff7452; padding: 1px 7px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bubble { position: absolute; background: #ffffff; color: #23283a; border-radius: 14px; padding: 5px 12px; font-family: var(--f-display); font-size: .95rem; box-shadow: 0 3px 10px rgba(0,0,0,.18); white-space: nowrap; pointer-events: none; z-index: 3; transition: bottom .8s ease, left .8s ease; }
.bubble::after { content: ""; position: absolute; left: -5px; bottom: 9px; width: 10px; height: 10px; background: #ffffff; transform: rotate(45deg); }
.pet { position: absolute; z-index: 2; cursor: pointer; transform: translateX(-50%); transition: height .6s, width .6s; }
.pet svg { width: 100%; height: 100%; display: block; overflow: visible; }
.pet .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag .5s ease-in-out infinite alternate; }
.pet .ears { transform-box: fill-box; transform-origin: 50% 100%; animation: ear 3s ease-in-out infinite; }
@keyframes wag { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
@keyframes ear { 0%, 90%, 100% { transform: rotate(0); } 95% { transform: rotate(-8deg); } }
.pet.hop { animation: pethop .5s ease; }
@keyframes pethop { 50% { transform: translateX(-50%) translateY(-18%); } }
.petneed { position: absolute; z-index: 3; font-size: .9rem; background: #fff; border-radius: 10px; padding: 1px 6px; box-shadow: 0 2px 6px rgba(0,0,0,.15); pointer-events: none; transform: translateX(-50%); }
.petchip { position: absolute; right: 10px; top: 10px; z-index: 3; font-family: var(--f-display); font-size: .85rem; background: rgba(255,255,255,.92); color: #23283a; padding: 3px 10px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.petpick { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-top: 12px; }
.petpick button { border: 2px solid transparent; background: var(--surface-2); border-radius: 18px; padding: 10px 4px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font-family: var(--f-display); font-size: 1rem; }
.petpick button:hover { border-color: var(--accent); }
.petpick button span { width: 74px; height: 60px; display: block; }
.petpick button small { font-family: var(--f-body); font-size: .75rem; color: var(--muted); }
.badge { position: absolute; left: 10px; top: 10px; z-index: 3; font-family: var(--f-display); font-size: .85rem; background: rgba(255,255,255,.92); color: #23283a; padding: 3px 10px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.world { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 4; background: rgba(255,255,255,.95); color: #b23a0a; border-radius: 12px; padding: 6px 10px; font-size: .82rem; box-shadow: 0 3px 10px rgba(0,0,0,.18); }
.world b { font-family: var(--f-display); font-weight: 400; }
.floats { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.float { position: absolute; font-family: var(--f-display); font-size: .95rem; padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,.95); box-shadow: 0 2px 6px rgba(0,0,0,.15); animation: rise 1.6s ease forwards; white-space: nowrap; }
.float.pos { color: #2b8a3e; } .float.neg { color: #d9480f; }
.heart { position: absolute; font-size: 22px; animation: rise 1.2s ease forwards; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } 15% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -60px); } }
.timebar { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); padding: 0 6px; }
.timebar .track { height: 8px; border-radius: 999px; background: var(--surface); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.timebar .track i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #ffb347); border-radius: inherit; transition: width .9s linear; }
.timebar b { color: var(--ink); font-family: var(--f-display); font-weight: 400; font-variant-numeric: tabular-nums; }

/* 상태 링 */
.rings { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.ring { display: grid; justify-items: center; gap: 2px; text-align: center; }
.ring .dial { position: relative; width: 100%; max-width: 62px; aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { fill: none; stroke: var(--track); stroke-width: 5; }
.ring .val { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .9s ease; }
.ring .ic { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.35rem; }
.ring small { font-size: .74rem; color: var(--muted); }
.ring b { font-family: var(--f-display); font-weight: 400; font-size: .95rem; line-height: 1; font-variant-numeric: tabular-nums; }
.ring.low b { color: var(--warn); }
.ring.low .dial { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }

/* 할 일 */
.acthead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs { display: flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.tab { border: none; background: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-family: var(--f-display); font-size: .98rem; color: var(--muted); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.toggle { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle .sw { width: 40px; height: 24px; border-radius: 999px; background: var(--track); position: relative; transition: background .2s; }
.toggle .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.toggle input:checked + .sw { background: var(--accent-2); }
.toggle input:checked + .sw::after { transform: translateX(16px); }
.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 360px) { .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.act { position: relative; display: grid; justify-items: center; align-content: start; gap: 2px; text-align: center; background: var(--surface-2); border: 2px solid transparent; border-radius: 18px; padding: 10px 6px 8px; cursor: pointer; transition: transform .1s ease, border-color .15s ease; min-height: 92px; }
.act:hover:not(:disabled) { border-color: var(--accent); }
.act:active:not(:disabled) { transform: scale(.96); }
.act .ic { font-size: 1.9rem; line-height: 1.1; }
.act .nm { font-family: var(--f-display); font-size: .95rem; line-height: 1.2; }
.act .cs { font-size: .72rem; color: var(--muted); line-height: 1.2; font-variant-numeric: tabular-nums; }
.act .gm { position: absolute; top: 6px; right: 8px; font-size: .75rem; }
.act:disabled { cursor: not-allowed; }
.act:disabled .ic, .act:disabled .nm { opacity: .4; }
.act.wait .cs { color: var(--accent); }

/* 재능 + 일기 */
.skills { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.skill { text-align: center; background: var(--surface-2); border-radius: 14px; padding: 6px 2px; }
.skill i { font-style: normal; font-size: 1.1rem; display: block; line-height: 1.2; }
.skill b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.1rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.skill span { font-size: .7rem; color: var(--muted); }
.diaryhead { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
.linkbtn { border: none; background: none; color: var(--accent); cursor: pointer; font-size: .88rem; padding: 4px; }
.diary { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.diary li { display: grid; grid-template-columns: 6.4em minmax(0,1fr); gap: 8px; font-size: .92rem; padding: 6px 10px; background: var(--surface-2); border-radius: 12px; }
.diary li time { color: var(--muted); font-size: .78rem; padding-top: 2px; font-variant-numeric: tabular-nums; }
.diary li.big span { color: var(--accent); font-family: var(--f-display); }
.fulldiary { max-height: 60vh; overflow-y: auto; }

/* 모달 */
.overlay { position: fixed; inset: 0; background: rgba(15, 20, 35, .55); display: grid; place-items: center; z-index: 50;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); color: var(--ink); border-radius: 24px; padding: 20px; width: min(440px, 100%); max-height: 100%; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,.35); animation: pop .3s cubic-bezier(.3,1.4,.5,1); }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.modal .tag { font-size: .78rem; letter-spacing: .04em; color: var(--accent); font-family: var(--f-display); }
.modal h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; margin: 2px 0 8px; text-wrap: balance; line-height: 1.25; }
.modal p { margin: 0 0 10px; }
.modal .art { display: flex; justify-content: center; margin: 4px 0 10px; font-size: 3.2rem; line-height: 1; }
.modal .art svg { height: 170px; width: auto; }
.choices { display: grid; gap: 8px; margin-top: 14px; }
.choice { background: var(--surface-2); border: 2px solid transparent; border-radius: 16px; padding: 11px 14px; text-align: left; cursor: pointer; font-family: var(--f-display); font-size: 1.05rem; }
.choice small { display: block; font-family: var(--f-body); font-size: .8rem; color: var(--muted); }
.choice:hover { border-color: var(--accent); }
.choice.primary { background: var(--accent); color: var(--accent-ink); text-align: center; }
.choice.primary small { color: inherit; opacity: .85; }
.choice.sel { border-color: var(--accent-2); }
.album { display: grid; gap: 6px; margin: 10px 0; }
.album .row { display: grid; grid-template-columns: 5.5em minmax(0,1fr) 2.4em; gap: 8px; align-items: center; font-size: .9rem; }
.album .row .bar { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
.album .row .bar i { display: block; height: 100%; background: var(--accent); }
.album .row .v { text-align: right; font-variant-numeric: tabular-nums; }
.stars { text-align: center; font-size: 1.4rem; letter-spacing: .1em; color: var(--s-energy); }
.list { margin: 0 0 10px; padding-left: 1.1em; font-size: .9rem; }
.list li { margin-bottom: 3px; }

/* 미니게임 */
.ghead { display: flex; align-items: flex-start; gap: 10px; }
.ghead h3 { margin-bottom: 2px; }
.ghead .ghost { margin-left: auto; border: none; background: var(--surface-2); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .85rem; color: var(--muted); white-space: nowrap; }
.gdesc { font-size: .88rem; color: var(--muted); }
.ghud { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); margin: 6px 2px; font-variant-numeric: tabular-nums; }
.ghud b { color: var(--ink); font-family: var(--f-display); font-weight: 400; font-size: 1.05rem; }
.gtimer { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
.gtimer i { display: block; height: 100%; background: var(--accent-2); width: 100%; }
.area { position: relative; border-radius: 18px; background: var(--surface-2); min-height: 260px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.area canvas { display: block; width: 100%; touch-action: none; }
.count { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.75); font-family: var(--f-display); font-size: 4rem; color: #ff7452; z-index: 5; }
.count.small { font-size: 1.6rem; }
.bigbtn { display: block; width: 100%; padding: 14px; border-radius: 16px; border: none; background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-size: 1.3rem; cursor: pointer; touch-action: none; margin-top: 8px; }
.bigbtn:active { transform: scale(.97); }
.spot { position: absolute; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle, rgba(115,80,45,.92), rgba(115,80,45,.45) 66%, transparent 72%); transform: translate(-50%, -50%); }
.foam { position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid rgba(80,150,220,.85); background: radial-gradient(circle at 35% 35%, #fff, rgba(220,240,255,.6)); animation: rise .9s ease forwards; pointer-events: none; }
.scrubKid { position: absolute; left: 50%; top: 6px; bottom: 6px; transform: translateX(-50%); pointer-events: none; }
.scrubKid svg { height: 100%; width: auto; display: block; }
.quizShow { font-size: 2rem; text-align: center; letter-spacing: .1em; line-height: 1.3; margin: 8px 0; word-break: break-all; }
.quizQ { font-family: var(--f-display); font-size: 1.3rem; text-align: center; margin: 10px 0 14px; }
.quizOpts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 10px 12px; }
.quizOpts button { padding: 14px 8px; border-radius: 14px; border: none; background: var(--surface); box-shadow: 0 2px 0 var(--line); cursor: pointer; font-family: var(--f-display); font-size: 1.25rem; }
.quizOpts button.ok { background: #2b8a3e; color: #fff; }
.quizOpts button.no { background: #d9480f; color: #fff; }
.pads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
.pad { aspect-ratio: 1.5; border-radius: 18px; border: none; cursor: pointer; filter: saturate(.55) brightness(.9); transition: filter .1s, transform .1s; font-size: 2.2rem; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
.pad.on { filter: none; transform: translateY(-3px) scale(1.04); box-shadow: 0 0 0 4px #fff, 0 0 24px rgba(255,255,255,.8); }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; perspective: 600px; }
.card3 { aspect-ratio: .8; border: none; padding: 0; background: none; cursor: pointer; position: relative; transform-style: preserve-3d; transition: transform .35s ease; }
.card3 .f, .card3 .b { position: absolute; inset: 0; border-radius: 12px; display: grid; place-items: center; backface-visibility: hidden; }
.card3 .b { background: linear-gradient(135deg, #ff7452, #ffb347); box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.card3 .b::after { content: "?"; font-family: var(--f-display); font-size: 1.4rem; color: rgba(255,255,255,.85); }
.card3 .f { background: var(--surface); transform: rotateY(180deg); font-size: 1.9rem; box-shadow: 0 3px 0 var(--line); }
.card3.open { transform: rotateY(180deg); }
.card3.done .f { background: #d3f9d8; }
.item { position: absolute; font-size: 2.3rem; background: none; border: none; cursor: grab; transform: translate(-50%,-50%); padding: 4px; line-height: 1; touch-action: none; transition: left .3s ease, top .3s ease, opacity .3s; }
.item.drag { transition: none; cursor: grabbing; z-index: 3; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); }
.box { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: 130px; height: 70px; border-radius: 10px 10px 16px 16px; background: linear-gradient(#c8925a, #a87447); display: grid; place-items: center; font-family: var(--f-display); color: #fff; box-shadow: inset 0 6px 0 rgba(0,0,0,.12); }
.box.hot { box-shadow: 0 0 0 4px #2f9e8f; }

const msPerYear = () => (SPEEDS[S.speed] || SPEEDS.fast).ms;
const scale = () => REAL_YEAR / msPerYear();

const monthsOf = () => Math.floor((S.age - Math.floor(S.age)) * 12);
const calYear = () => new Date(S.bornAt).getFullYear() + ageOf();
function baseHeight(af) {
  if (af >= 60) return 173 - (Math.min(af, 100) - 60) * 0.18;
  if (af >= 18) return 173;
  const a = Math.floor(af), f = af - a;
  return KID_H[a] + (KID_H[a + 1] - KID_H[a]) * f;
}
const heightAt = af => Math.round((baseHeight(af) + Math.min(4, S.sport / 15) * Math.min(1, af / 18)) * 10) / 10;
const heightCm = () => heightAt(S.age);
const ageLabel = () => ageOf() >= 19 ? `${ageOf()}살` : `${ageOf()}살 ${monthsOf()}개월`;

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const d = JSON.parse(raw); if (d && typeof d.age === 'number') return Object.assign(freshState(), d); } } catch (e) {}
  return null;
}
let diaryVer = 0;
function addDiary(text, big) {
  S.diary.unshift({ when: ageLabel(), text, big: !!big });
  if (S.diary.length > 150) S.diary.length = 150;
  diaryVer++;
}

function apply(eff, mult) {
  const changes = [];
  const m = mult == null ? 1 : mult;
  for (const k in eff) {
    let d = eff[k];
    const isSkill = SKILL_KEYS.includes(k);
    if (isSkill && d > 0) d = d * m * Math.max(0.15, 1 - S[k] / 120) * (S.happy >= 70 ? 1.25 : 1);
    else if (d > 0 && k === 'happy') d = d * (0.6 + 0.4 * m);
    else if (d > 0 && (k === 'hunger' || k === 'clean' || k === 'health')) d = d * (0.7 + 0.3 * Math.min(1, m));
    const before = S[k];
    S[k] = clamp(before + d, 0, 100);
    const real = isSkill ? Math.round((S[k] - before) * 10) / 10 : Math.round(S[k] - before);
    if (real !== 0) changes.push([k, real]);
  }
  return changes;
}
const fmtChange = ([k, d]) => `${ALL_NAMES[k]} ${d > 0 ? '+' : ''}${d}`;

function moodOf() {
  if (S.health < 35) return 'sick';
  if (S.energy < 20) return 'sleepy';
  if (Math.min(S.hunger, S.clean, S.happy) < 25) return 'sad';
  if (S.happy >= 65) return 'happy';

const PROVERBS = [['가는 말이 고와야', '오는 말이 곱다'], ['낮말은 새가 듣고', '밤말은 쥐가 듣는다'], ['티끌 모아', '태산'], ['세 살 버릇', '여든까지 간다'], ['원숭이도', '나무에서 떨어진다'], ['백지장도', '맞들면 낫다'], ['소 잃고', '외양간 고친다'], ['고래 싸움에', '새우 등 터진다'], ['발 없는 말이', '천 리 간다']];
function genQuiz(age) {
  const qs = [];
  const ri = (a, b) => Math.floor(rand(a, b + 1));
  const mk = (q, a, gen, show) => { const set = new Set([String(a)]); let guard = 0; while (set.size < 4 && guard++ < 60) set.add(String(gen())); return { q, a: String(a), opts: shuffle([...set]), show }; };
  const used = new Set();
  let tries = 0;
  while (qs.length < 3 && tries++ < 30) {
    let item;
    if (age < 3) {
      const animals = [['🐶', '강아지'], ['🐱', '고양이'], ['🐰', '토끼'], ['🐻', '곰'], ['🐷', '돼지'], ['🐥', '병아리'], ['🐮', '소']];
      const [e, nm] = pick(animals);
      item = mk(`${nm}는 어디 있을까?`, e, () => pick(animals)[0]);
    } else if (age < 7) {
      const e = pick(['🍎', '⭐', '🐟', '🚗', '🌸']); const c = ri(2, 9);
      item = mk('모두 몇 개일까요?', c, () => ri(1, 10), e.repeat(c));
    } else if (age < 10) {
      const max = age < 9 ? 20 : 100; const a = ri(2, max - 2), b = ri(1, max - a);
      item = Math.random() < 0.6 ? mk(`${a} + ${b} = ?`, a + b, () => Math.max(0, a + b + ri(-5, 5))) : mk(`${a + b} − ${b} = ?`, a, () => Math.max(0, a + ri(-5, 5)));
    } else if (age < 13) {
      const a = ri(2, 9), b = ri(2, 9); item = mk(`${a} × ${b} = ?`, a * b, () => a * b + pick([-a, a, -b, b, 1, -1]));
    } else if (age < 19) {
      if (Math.random() < 0.5) { const a = ri(12, 49), b = ri(3, 9); item = mk(`${a} × ${b} = ?`, a * b, () => a * b + ri(-3, 3) * 10 + ri(-2, 2)); }
      else { const x = ri(2, 20), a = ri(3, 30); item = mk(`x + ${a} = ${x + a} 일 때, x는?`, x, () => Math.max(0, x + ri(-6, 6))); }
    } else if (age < 60) {
      const base = pick([200, 400, 500, 800, 1200]), p = pick([10, 15, 20, 25, 30, 50]);
      if (Math.random() < 0.5) item = mk(`${base}의 ${p}%는?`, base * p / 100, () => base * pick([5, 10, 15, 20, 25, 30, 40, 50]) / 100);
      else { const a = ri(120, 890), b = ri(110, 790); item = mk(`${a} + ${b} = ?`, a + b, () => a + b + pick([-100, 100, -10, 10, -1, 1])); }
    } else {
      const pv = pick(PROVERBS);
      item = mk(`"${pv[0]} ___"`, pv[1], () => pick(PROVERBS)[1]);

    const k = item.q + (item.show || '');

    used.add(k); qs.push(item);
  }

}

/* ================= 시간 흐름 ================= */
function startWorld(id) {
  const w = WORLD[id];
  S.world = { id, until: S.age + w.dur, start: S.age, vax: false };
  S.worldLog.push({ name: w.name, year: calYear() });
  if (id === 'virus') { S.virusDone = true; S.nextInfect = S.age + 0.15; }
  addDiary(`${w.name}이(가) 시작됐어요.`, true);
  queue(Object.assign(eventModal({ title: w.title, text: w.text, choices: w.choices }, `${calYear()}년 · 뉴스 속보`), { art: w.ic }));
  actKey = '';
}
function endWorld() {
  const w = WORLD[S.world.id];
  addDiary(w.end, true);
  if (!quiet) queue({ tag: '좋은 소식', title: w.end, art: '🌤️', choices: [{ label: '다행이다!', primary: true, run: () => apply({ happy: 10 }) }] });
  S.world = null; S.iso = 0; actKey = '';
}
function advance(dt) {
  if (!S.started || S.done || dt <= 0) return;
  const mpy = msPerYear();
  let remaining = dt;
  while (remaining > 0 && !S.done) {
    const chunk = Math.min(remaining, mpy * 0.02);
    remaining -= chunk;
    const years = chunk / mpy;
    const h = years * 18; // 실제 시간 모드 기준 몇 시간이 흘렀는지
    const st = stageOf(ageOf()).key;
    const fl = quiet ? 15 : 0;
    const dec = (k, v, floor) => { S[k] = clamp(S[k] - v, Math.min(S[k], floor), 100); };
    dec('hunger', 7 * h, fl); dec('clean', (st === 'toddler' ? 6 : 4) * h, fl); dec('happy', 3 * h, quiet ? 20 : 0);
    S.energy = clamp(S.energy + 10 * h - (S.world && WORLD[S.world.id].heat ? 5 * h : 0), 0, 100);
    let dh = (S.hunger < 20 || S.clean < 20 || S.energy < 8) ? -5 * h : 2 * h;
    if (S.age >= 60) dh -= 1 * h;
    if (S.age >= 80) dh -= 1.5 * h;
    if (S.world && WORLD[S.world.id].drain) dh -= WORLD[S.world.id].drain * h;
    S.health = clamp(S.health + dh, quiet ? Math.min(S.health, 40) : 0, 100);
    S.happySum += S.happy * years; S.happyN += years;
    if (S.pet) {
      S.pet.food = clamp(S.pet.food - 6 * h, quiet ? Math.min(S.pet.food, 25) : 0, 100);
      if (S.pet.food < 20) S.happy = clamp(S.happy - 2 * h, 0, 100);
      if (!S.pet.bye && S.age - S.pet.since >= PETS[S.pet.kind].life) { S.pet.bye = true; queue(petByeModal()); }
    }

    const prevAge = ageOf();
    S.age = Math.min(END_AGE, S.age + years);
    const newAge = ageOf();
    for (let age = prevAge + 1; age <= newAge; age++) onBirthday(age, stageOf(age - 1).key);
    if (S.done) break;

    if (S.world && S.age >= S.world.until) endWorld();
    if (!S.world && !S.virusDone && S.age >= S.virusAge) startWorld('virus');
    if (S.age >= S.nextWorld) {
      S.nextWorld += 1;
      if (!S.world && S.age > 2 && Math.random() < 0.13) startWorld(pick(['flu', 'heat', 'typhoon', 'dust']));
    }
    if (worldOn('virus')) {
      if (!S.world.vax && S.age >= S.world.start + 0.8) {
        S.world.vax = true;
        queue({ tag: '뉴스', title: '백신이 나왔어요', art: '💉', body: '<p>바이러스 백신 접종이 시작됐어요. 맞으면 걸릴 위험이 크게 줄어요.</p>',
          choices: [{ label: '백신 맞기', hint: '팔이 조금 아플 수 있어요', primary: true, run: () => { S.vaccinated = true; apply({ health: -5, happy: -3 }); addDiary('바이러스 백신을 맞았어요. 팔이 조금 뻐근해요.', true); } },
                    { label: '조금 더 지켜보기', run: () => addDiary('백신은 조금 더 지켜보기로 했어요.') }] });
      }
      if (S.age >= S.nextInfect && S.iso <= S.age) {
        S.nextInfect = S.age + 0.12;

        if (S.careful) p *= 0.7;

        if (Math.random() < p) {

          queue({ tag: '확진', title: '나율이가 바이러스에 걸렸어요', art: nayulSVG(S.age, 'sick'), body: `<p>열이 나고 기침을 해요. 앞으로 약 ${fmtDur(0.08 * mpy)} 동안 집에서 격리해야 해요. 밥, 잠, 씻기, 영상통화만 할 수 있어요.</p>`,
            choices: [{ label: '푹 쉬면서 이겨내자', primary: true, run: () => apply({ energy: 15 }) }] });
        }

    }
    if (S.age >= S.nextEvent) {
      S.nextEvent = S.age + rand(0.18, 0.3);
      if (!quiet && Math.random() < 0.55 && queueM.length < 3) {
        const key = stageOf(ageOf()).key;
        const pool = EVENTS.filter(e => e.stages.includes(key) && (e.repeat || !S.seen.includes(e.id)) && (!e.need || e.need(S)));
        const fresh = pool.filter(e => !e.repeat);

}

    if (grown > 0.01) {
      const news = S.diary.slice(0, Math.min(8, diaryVer - dv)).map(d => `<li>${d.when} · ${d.text}</li>`).join('');
      queue({ tag: '다시 만난 나율이', title: `${fmtDur(dt)} 만이에요!`, art: nayulSVG(S.age, moodOf()),
        body: `<p>그동안 나율이가 ${grown >= 1 ? `${Math.floor(grown)}년 넘게` : `${Math.max(1, Math.round(grown * 12))}개월쯤`} 자랐어요.</p>${news ? `<ul class="list">${news}</ul>` : ''}`,
        choices: [{ label: '보고 싶었어, 나율아!', primary: true, run: () => apply({ happy: 8 }) }] }, true);
    }
  } else advance(dt);
  render();
  if (!modalOpen) showNext();
}

/* ================= 할 일 하기 ================= */
function doAction(id) {
  if (modalOpen) return;
  const a = ACTIONS.find(x => x.id === id);
  const st = stageOf(ageOf()).key;
  if (!a || !availability(a).ok) return;
  if (a.special === 'adopt') { adoptModal(); return; }
  if (S.games !== false && actGame(a, st)) runGame(a, st);
  else finishAction(a, st, 0.6, true);
}
function finishAction(a, st, score, instant) {
  const eff = Object.assign({}, a.eff);
  if (a.cost) eff.energy = (eff.energy || 0) - a.cost;
  const changes = apply(eff, 0.4 + score);
  if (a.onDo) a.onDo(score);
  S.cd[a.id] = Date.now() + cdMs(a);
  addDiary(actLog(a, st));
  floats(changes); bounce(); say(pick(a.say));
  if (instant) { save(); render(); return; }
  const stars = score >= 0.85 ? 3 : score >= 0.5 ? 2 : score > 0.25 ? 1 : 0;
  setModal(`<div class="result"><div class="tag">${actName(a, st)}</div><h3>${['다음엔 더 잘할 수 있어요', '좋아요!', '잘했어요!', '완벽해요!'][stars]}</h3><div class="art">${nayulSVG(Math.max(S.age, 0), stars >= 2 ? 'happy' : 'normal')}</div><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div><div class="chg">${changes.map(c => `<span class="${c[1] > 0 ? 'pos' : 'neg'}">${fmtChange(c)}</span>`).join('')}</div><div class="choices"><button class="choice primary" type="button" id="gOk">확인</button></div></div>`);
  $('gOk').focus();
  $('gOk').onclick = closeModal;
}

/* ================= 설정 ================= */
function settingsModal() {
  const cur = S.speed;
  const order = ['fast', 'turbo', 'real'];
  setModal(`<div class="tag">설정</div><h3>시간 흐르는 속도</h3><p style="font-size:.9rem;color:var(--muted)">창을 닫아도 시간은 흘러요. 다시 열면 그동안 있었던 일을 알려줘요.</p>
    <div class="choices">${order.map(k => `<button class="choice${k === cur ? ' sel' : ''}" type="button" data-sp="${k}">${SPEEDS[k].label}${k === cur ? ' ✓' : ''}<small>${SPEEDS[k].desc}</small></button>`).join('')}</div>
    <div class="choices"><button class="choice" type="button" id="resetBtn">처음부터 다시 키우기</button><button class="choice primary" type="button" id="closeSet">닫기</button></div>`);
  $('modal').querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { S.speed = b.dataset.sp; S.last = Date.now(); S.cd = {}; addDiary(`시간 속도를 "${SPEEDS[S.speed].label}"(으)로 바꿨어요.`); closeModal(); });
  $('closeSet').onclick = closeModal;
  $('resetBtn').onclick = () => {
    setModal(`<div class="tag">처음부터</div><h3>정말 처음부터 다시 키울까요?</h3><p>지금 ${ageLabel()}인 나율이의 기록이 모두 지워져요.</p><div class="choices"><button class="choice" type="button" id="noBtn">계속 키울래요</button><button class="choice primary" type="button" id="yesBtn">아기 때부터 다시</button></div>`);
    $('noBtn').onclick = closeModal;
    $('yesBtn').onclick = () => { const sp = S.speed; S = freshState(); S.speed = sp; queueM = []; actKey = ''; diaryVer++; queue(startModal()); closeModal(); };
  };
}
function startModal() {
  return {
    tag: `${new Date().getFullYear()}년, 우리 집`, title: '나율이가 태어났어요!', art: nayulSVG(0, 'happy'),
    body: `<p>몸무게 3.2kg, 키 50cm. 나율이를 백 살까지 잘 돌봐주세요.</p>
      <ul class="list">
        <li>1년이 실제 1시간이에요. 백 살까지 약 4일 걸려요. (⚙️ 설정에서 더 빠르게, 또는 실제 시간처럼 느긋하게 바꿀 수 있어요)</li>
        <li>창을 닫아도 나율이는 자라요.</li>
        <li>🎮 표시가 있는 일은 미니게임으로 해요. 잘할수록 재능이 더 늘어요. 귀찮으면 미니게임을 꺼도 돼요.</li>
        <li>살다 보면 독감, 태풍, 신종 바이러스 같은 일도 생겨요.</li>
      </ul>`,
    choices: [{ label: '나율이 키우기 시작!', primary: true, run: () => { S.started = true; S.bornAt = Date.now(); S.last = Date.now(); addDiary('나율이가 태어났어요! 3.2kg, 50cm.', true); } }],
  };
}

/* ================= 시작 ================= */
function pet() {
  const r = $('kid').getBoundingClientRect(), box = $('stage').getBoundingClientRect();
  const h = document.createElement('div'); h.className = 'heart'; h.textContent = '❤️';
  h.style.left = (r.left - box.left + r.width / 2 + rand(-20, 20)) + 'px'; h.style.top = (r.top - box.top + rand(0, 30)) + 'px';
  $('floats').appendChild(h); setTimeout(() => h.remove(), 1200);
  const now = Date.now();
  if (now < S.petCd || !S.started || S.done) { say(pick(['헤헤', '간지러워!'])); return; }
  S.petCd = now + 15e3;
  apply({ happy: 3 }); bounce();
  say(pick(ageOf() < 3 ? ['까르르!', '헤헤'] : ageOf() < 13 ? ['헤헤, 좋아!', '또 해줘!'] : ageOf() < 60 ? ['고마워요', '힘이 나요!'] : ['허허, 고맙구나']));
  render();
}
function start(data) {
  S = (data && data.S && typeof data.S.age === 'number') ? Object.assign(freshState(), data.S) : (load() || freshState());
  if (!S.v4) { S.v4 = true; if (S.speed === 'real') S.speed = 'fast'; S.cd = {}; if (S.games == null) S.games = true; if (!S.tab) S.tab = 'care'; }
  render(true);
  $('bubble').textContent = needLine() || pick(IDLE[stageOf(ageOf()).key]);
  $('actions').addEventListener('click', e => { const b = e.target.closest('.act'); if (b && !b.disabled) doAction(b.dataset.id); });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { S.tab = t.dataset.tab; actKey = ''; save(); render(); }));
  $('gameToggle').addEventListener('change', e => { S.games = e.target.checked; save(); render(); });
  $('diaryAll').addEventListener('click', () => { if (!modalOpen) diaryModal(); });
  $('kid').addEventListener('click', pet);
  $('pet').addEventListener('click', petPet);
  $('pet').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); petPet(); } });
  $('kid').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pet(); } });
  $('settingsBtn').addEventListener('click', () => { if (!modalOpen) settingsModal(); });
  window.addEventListener('resize', () => render(true));
  if (!S.started) queue(startModal());
  else if (S.done) queue(endingModal());
  tick();
  setInterval(tick, 1000);
  setInterval(save, 5000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else tick(); });
}
window.__nayul = { get S() { return S; }, set S(v) { S = v; }, tick, render };
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
